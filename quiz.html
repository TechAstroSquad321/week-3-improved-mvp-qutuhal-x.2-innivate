<section class="quiz-section">

    <div class="quiz-card">

        <div class="quiz-top">

            <h3 id="questionNumber">
                Question 1 / 5
            </h3>

            <h3>
                Score: <span id="score">0</span>
            </h3>

        </div>

        <div class="quiz-progress">
            <div id="quizProgress"></div>
        </div>

        <h1 id="question">
            Loading question...
        </h1>

        <div id="answerContainer" class="answer-container">
        </div>

        <p id="feedback" class="quiz-feedback"></p>

        <button
            id="nextButton"
            class="primary-btn"
            disabled>
            Next →
        </button>

    </div>


    <!-- FINAL RESULT -->

    <div
        id="resultCard"
        class="quiz-card result-card"
        style="display: none;">

        <div class="result-icon">
            🎉
        </div>

        <h1>Quiz Complete!</h1>

        <p>Your final score is:</p>

        <div id="finalScore" class="final-score">
            0 / 5
        </div>

        <p id="resultMessage">
            Great job!
        </p>

        <button
            id="restartButton"
            class="primary-btn">
            🔄 Try Again
        </button>

    </div>

</section>
