<script>
/* =========================================================
   SIGNLEARN - ASL RECOGNITION
   IMPORTANT:
   - Do NOT change the camera code.
   - This section only handles ASL recognition.
   ========================================================= */

let aslModel = null;
let hands = null;
let recognitionReady = false;
let recognizing = false;

const MODEL_URL =
    "https://huggingface.co/AmimulBmeIU/asl-alphabet-classifier/resolve/main/tfjs/model.json";

const LABELS_URL =
    "https://huggingface.co/AmimulBmeIU/asl-alphabet-classifier/resolve/main/tfjs/labels.json";

let labels = [];

/* ---------------------------------------------------------
   Load external JavaScript library
   --------------------------------------------------------- */

function loadScript(src) {
    return new Promise((resolve, reject) => {

        // Don't load the same script twice
        if (document.querySelector(`script[src="${src}"]`)) {
            resolve();
            return;
        }

        const script = document.createElement("script");

        script.src = src;
        script.async = true;

        script.onload = () => resolve();

        script.onerror = () => {
            reject(new Error("Could not load: " + src));
        };

        document.head.appendChild(script);
    });
}


/* ---------------------------------------------------------
   Update recognition text
   --------------------------------------------------------- */

function setRecognitionStatus(title, message) {

    const titleElement =
        document.getElementById("recognitionStatus");

    const messageElement =
        document.getElementById("recognitionMessage");

    if (titleElement) {
        titleElement.textContent = title;
    }

    if (messageElement) {
        messageElement.textContent = message;
    }
}


/* ---------------------------------------------------------
   Load ASL AI
   --------------------------------------------------------- */

async function loadAI() {

    try {

        setRecognitionStatus(
            "Loading ASL AI...",
            "Preparing the hand-recognition model."
        );

        /* TensorFlow.js */
        await loadScript(
            "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"
        );

        /* MediaPipe Hands */
        await loadScript(
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
        );

        /* -------------------------------------------------
           Load labels
           ------------------------------------------------- */

        const labelsResponse = await fetch(LABELS_URL);

        if (!labelsResponse.ok) {
            throw new Error(
                "Could not load ASL labels."
            );
        }

        labels = await labelsResponse.json();


        /* -------------------------------------------------
           Load TensorFlow model
           ------------------------------------------------- */

        console.log("Loading ASL model...");

        aslModel = await tf.loadLayersModel(MODEL_URL);

        console.log("ASL model loaded.");
        console.log("Input shape:", aslModel.inputs[0].shape);
        console.log("Output shape:", aslModel.outputs[0].shape);


        /* -------------------------------------------------
           MediaPipe Hands
           ------------------------------------------------- */

        hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });


        hands.setOptions({

            maxNumHands: 1,

            modelComplexity: 1,

            minDetectionConfidence: 0.55,

            minTrackingConfidence: 0.55

        });


        hands.onResults(processHandResults);


        recognitionReady = true;


        setRecognitionStatus(
            "ASL AI Ready",
            "Show one hand clearly to the camera."
        );

        console.log("ASL recognition ready.");

    } catch (error) {

        console.error(
            "ASL recognition error:",
            error
        );

        recognitionReady = false;

        /*
           IMPORTANT:
           The camera is NOT considered broken here.
        */

        setRecognitionStatus(
            "ASL AI unavailable",
            "The camera is working, but the recognition model could not load."
        );

        const whatISee =
            document.getElementById("whatISee");

        if (whatISee) {

            whatISee.textContent =
                "Camera is working, but ASL recognition failed to load.";

        }

        /*
           Show the real error in the browser console
           instead of pretending the camera failed.
        */

        console.error(
            "Detailed recognition error:",
            error.message
        );
    }
}


/* ---------------------------------------------------------
   Convert MediaPipe landmarks to model input
   --------------------------------------------------------- */

function landmarksToTensor(landmarks) {

    const values = [];

    /*
       The model expects 21 MediaPipe hand landmarks.

       Each landmark contains:
       x
       y
       z

       21 × 3 = 63 values.
    */

    for (let i = 0; i < landmarks.length; i++) {

        values.push(
            landmarks[i].x,
            landmarks[i].y,
            landmarks[i].z
        );
    }

    return tf.tensor2d(
        [values],
        [1, 63],
        "float32"
    );
}


/* ---------------------------------------------------------
   Process detected hand
   --------------------------------------------------------- */

async function processHandResults(results) {

    if (!recognitionReady || !aslModel) {
        return;
    }

    const whatISee =
        document.getElementById("whatISee");


    /* No hand */
    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        if (whatISee) {
            whatISee.textContent =
                "No hand detected — place your hand in front of the camera.";
        }

        return;
    }


    const landmarks =
        results.multiHandLandmarks[0];


    let inputTensor = null;


    try {

        inputTensor =
            landmarksToTensor(landmarks);


        const prediction =
            aslModel.predict(inputTensor);


        /*
           Some TensorFlow.js models return a Tensor,
           while others can return an array.
        */

        const outputTensor =
            Array.isArray(prediction)
                ? prediction[0]
                : prediction;


        const probabilities =
            await outputTensor.data();


        /* Find highest probability */

        let highestIndex = 0;

        for (
            let i = 1;
            i < probabilities.length;
            i++
        ) {

            if (
                probabilities[i] >
                probabilities[highestIndex]
            ) {

                highestIndex = i;
            }
        }


        const confidence =
            probabilities[highestIndex];


        const letter =
            labels[highestIndex] ||
            String.fromCharCode(
                65 + highestIndex
            );


        const percentage =
            Math.round(confidence * 100);


        /*
           Only show reasonably confident predictions.
        */

        if (confidence >= 0.55) {

            showASLResult(
                letter,
                percentage
            );

        } else {

            if (whatISee) {

                whatISee.textContent =
                    "Hand detected — hold the sign steady.";

            }
        }


        if (Array.isArray(prediction)) {

            prediction.forEach(tensor => {
                if (tensor.dispose) {
                    tensor.dispose();
                }
            });

        } else if (prediction.dispose) {

            prediction.dispose();
        }


    } catch (error) {

        console.error(
            "Prediction error:",
            error
        );

    } finally {

        if (inputTensor) {
            inputTensor.dispose();
        }
    }
}


/* ---------------------------------------------------------
   Display ASL result
   --------------------------------------------------------- */

function showASLResult(letter, confidence) {

    const whatISee =
        document.getElementById("whatISee");

    if (whatISee) {

        whatISee.innerHTML = `
            <div style="
                font-size: 42px;
                font-weight: 800;
                margin-bottom: 6px;
            ">
                ${letter}
            </div>

            <div style="
                font-size: 14px;
                opacity: 0.8;
            ">
                ASL Letter • ${confidence}% confidence
            </div>
        `;
    }


    /*
       Also update common recognition-result
       elements if your page already has them.
    */

    const resultElements = [
        "recognizedSign",
        "recognitionResult",
        "resultText",
        "detectedSign"
    ];

    resultElements.forEach(id => {

        const element =
            document.getElementById(id);

        if (element) {
            element.textContent = letter;
        }

    });
}


/* ---------------------------------------------------------
   Recognition loop
   --------------------------------------------------------- */

async function runRecognition() {

    if (recognizing) {
        return;
    }

    recognizing = true;


    while (recognizing) {

        try {

            /*
               Make sure the existing camera is actually
               running before sending frames to MediaPipe.
            */

            if (
                !camera ||
                camera.readyState < 2 ||
                camera.videoWidth === 0 ||
                camera.videoHeight === 0
            ) {

                await new Promise(
                    resolve => setTimeout(resolve, 200)
                );

                continue;
            }


            if (
                recognitionReady &&
                hands
            ) {

                await hands.send({
                    image: camera
                });

            }

        } catch (error) {

            console.error(
                "Recognition frame error:",
                error
            );

        }


        /*
           Don't process every single frame.
           This keeps the browser responsive.
        */

        await new Promise(
            resolve => setTimeout(resolve, 80)
        );
    }
}


/* ---------------------------------------------------------
   Stop recognition
   --------------------------------------------------------- */

function stopRecognition() {

    recognizing = false;

    if (hands) {
        try {
            hands.close();
        } catch (error) {
            console.log(
                "Hands cleanup:",
                error
            );
        }
    }

    hands = null;

    recognitionReady = false;

    console.log(
        "ASL recognition stopped."
    );
}


/* ---------------------------------------------------------
   IMPORTANT:
   If your existing stopCamera() function already exists,
   add ONLY this line inside it:
   
       stopRecognition();

   DO NOT replace your camera code.
   --------------------------------------------------------- */

</script>
