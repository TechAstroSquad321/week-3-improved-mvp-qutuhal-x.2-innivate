<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Recognition</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

    <!-- COCO-SSD Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;

</head>

<body>

<div class="container">

    <h1>📷 Camera Recognition</h1>

    <p class="subtitle">
        Start your camera and let AI recognize objects.
    </p>

    <div class="camera-wrapper">

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <canvas id="canvas"></canvas>

        <div id="cameraPlaceholder" class="placeholder">

            <div class="camera-icon">📷</div>

            <h2>Camera Ready</h2>

            <p>
                Click "Start Camera" to begin recognition.
            </p>

        </div>

    </div>

    <div class="controls">

        <button id="startButton">
            🎥 Start Camera
        </button>

        <button id="stopButton" disabled>
            ⛔ Stop Camera
        </button>

    </div>

    <div id="status" class="status">
        Loading AI model...
    </div>

    <div id="recognition" class="recognition">
        Recognition will appear here.
    </div>

</div>

<script>

    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    const placeholder = document.getElementById("cameraPlaceholder");
    const status = document.getElementById("status");
    const recognition = document.getElementById("recognition");

    let stream = null;
    let model = null;
    let recognizing = false;

    // ---------------------------------------
    // LOAD AI MODEL
    // ---------------------------------------

    async function loadModel() {

        try {

            status.textContent = "🤖 Loading recognition model...";

            model = await cocoSsd.load();

            status.textContent =
                "✅ AI model ready! Start the camera.";

        } catch (error) {

            console.error(error);

            status.textContent =
                "❌ Could not load the AI model.";

        }

    }

    // ---------------------------------------
    // START CAMERA
    // ---------------------------------------

    async function startCamera() {

        if (!model) {

            status.textContent =
                "⏳ Please wait for the AI model to finish loading.";

            return;

        }

        try {

            status.textContent =
                "📷 Requesting camera permission...";

            stream = await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment",
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    }
                },

                audio: false

            });

            video.srcObject = stream;

            await video.play();

            video.style.display = "block";

            placeholder.style.display = "none";

            startButton.disabled = true;
            stopButton.disabled = false;

            recognizing = true;

            status.textContent =
                "🟢 Camera running — looking for objects...";

            resizeCanvas();

            recognizeObjects();

        } catch (error) {

            console.error(error);

            if (error.name === "NotAllowedError") {

                status.textContent =
                    "❌ Camera permission was denied. Allow camera access in your browser and try again.";

            } else if (error.name === "NotFoundError") {

                status.textContent =
                    "❌ No camera was found on this device.";

            } else if (error.name === "NotReadableError") {

                status.textContent =
                    "❌ Camera is being used by another application.";

            } else {

                status.textContent =
                    "❌ Could not start the camera: " + error.message;

            }

        }

    }

    // ---------------------------------------
    // STOP CAMERA
    // ---------------------------------------

    function stopCamera() {

        recognizing = false;

        if (stream) {

            stream.getTracks().forEach(track => {
                track.stop();
            });

            stream = null;

        }

        video.srcObject = null;

        video.style.display = "none";

        placeholder.style.display = "flex";

        startButton.disabled = false;
        stopButton.disabled = true;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        recognition.innerHTML =
            "Recognition stopped.";

        status.textContent =
            "Camera stopped.";

    }

    // ---------------------------------------
    // RESIZE CANVAS
    // ---------------------------------------

    function resizeCanvas() {

        if (!video.videoWidth) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

    }

    // ---------------------------------------
    // OBJECT RECOGNITION
    // ---------------------------------------

    async function recognizeObjects() {

        if (!recognizing) return;

        if (video.readyState >= 2) {

            resizeCanvas();

            try {

                const predictions =
                    await model.detect(video);

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                let detectedObjects = [];

                predictions.forEach(prediction => {

                    // Only show reasonably confident detections
                    if (prediction.score < 0.55) {
                        return;
                    }

                    const [
                        x,
                        y,
                        width,
                        height
                    ] = prediction.bbox;

                    // Bounding box
                    ctx.strokeStyle = "#00ff88";
                    ctx.lineWidth = 4;

                    ctx.strokeRect(
                        x,
                        y,
                        width,
                        height
                    );

                    // Label background
                    const label =
                        prediction.class +
                        " " +
                        Math.round(
                            prediction.score * 100
                        ) +
                        "%";

                    ctx.font =
                        "bold 18px Arial";

                    const textWidth =
                        ctx.measureText(label).width;

                    ctx.fillStyle =
                        "#00ff88";

                    ctx.fillRect(
                        x,
                        Math.max(
                            0,
                            y - 30
                        ),
                        textWidth + 14,
                        30
                    );

                    // Label text
                    ctx.fillStyle =
                        "#000000";

                    ctx.fillText(
                        label,
                        x + 7,
                        Math.max(
                            20,
                            y - 9
                        )
                    );

                    detectedObjects.push(
                        prediction.class
                    );

                });

                // Remove duplicates
                detectedObjects =
                    [...new Set(detectedObjects)];

                if (detectedObjects.length > 0) {

                    recognition.innerHTML =
                        "<strong>🔎 Detected:</strong> " +
                        detectedObjects.join(", ");

                } else {

                    recognition.innerHTML =
                        "<strong>🔎 Detected:</strong> Nothing yet...";

                }

            } catch (error) {

                console.error(
                    "Recognition error:",
                    error
                );

            }

        }

        // Continue recognition
        if (recognizing) {

            requestAnimationFrame(
                recognizeObjects
            );

        }

    }

    // ---------------------------------------
    // BUTTONS
    // ---------------------------------------

    startButton.addEventListener(
        "click",
        startCamera
    );

    stopButton.addEventListener(
        "click",
        stopCamera
    );

    // ---------------------------------------
    // WINDOW RESIZE
    // ---------------------------------------

    window.addEventListener(
        "resize",
        resizeCanvas
    );

    // ---------------------------------------
    // LOAD MODEL WHEN PAGE OPENS
    // ---------------------------------------

    loadModel();

</script>

</body>
</html>
