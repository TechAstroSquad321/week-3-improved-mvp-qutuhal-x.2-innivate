<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Practice</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aab3cc;
            margin-bottom: 25px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            margin: auto;
            background: #05070d;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #27304a;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1);
        }

        .camera-message {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: rgba(5, 7, 13, 0.85);
            color: #dbe2f5;
            font-size: 18px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #5865f2;
            color: white;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #stopBtn {
            background: #ed4245;
        }

        #stopBtn:hover {
            background: #c73537;
        }

        .status {
            margin-top: 18px;
            min-height: 24px;
            color: #aab3cc;
        }

        .success {
            color: #57f287;
        }

        .error {
            color: #ed4245;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>📷 Camera Practice</h1>

        <p class="subtitle">
            Allow camera access to start the camera.
        </p>

        <div class="camera-box">

            <video
                id="camera"
                autoplay
                playsinline
                muted>
            </video>

            <div id="cameraMessage" class="camera-message">
                Click <b>&nbsp;Start Camera&nbsp;</b> to request camera permission.
            </div>

        </div>

        <div class="controls">
            <button id="startBtn">
                📷 Start Camera
            </button>

            <button id="stopBtn" disabled>
                ⛔ Stop Camera
            </button>
        </div>

        <p id="status" class="status">
            Camera is currently off.
        </p>

    </main>

    <script>
        const video = document.getElementById("camera");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const status = document.getElementById("status");
        const cameraMessage = document.getElementById("cameraMessage");

        let cameraStream = null;

        // Check whether the browser supports cameras
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

            status.textContent =
                "❌ Your browser does not support camera access.";

            status.classList.add("error");

            startBtn.disabled = true;
        }

        // START CAMERA
        async function startCamera() {

            try {

                status.textContent = "🔄 Requesting camera permission...";
                status.className = "status";

                /*
                 * This is the important part.
                 * The browser should show:
                 *
                 * "Allow this site to use your camera?"
                 *
                 */
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        }
                    },
                    audio: false
                });

                video.srcObject = cameraStream;

                await video.play();

                cameraMessage.classList.add("hidden");

                startBtn.disabled = true;
                stopBtn.disabled = false;

                status.textContent = "✅ Camera is working!";
                status.classList.add("success");

            }

            catch (error) {

                console.error("Camera error:", error);

                cameraMessage.classList.remove("hidden");

                startBtn.disabled = false;
                stopBtn.disabled = true;

                if (error.name === "NotAllowedError") {

                    status.textContent =
                        "❌ Camera permission was denied. Click the camera icon 🔒 in your browser's address bar and allow Camera.";

                }

                else if (error.name === "NotFoundError") {

                    status.textContent =
                        "❌ No camera was found on this device.";

                }

                else if (error.name === "NotReadableError") {

                    status.textContent =
                        "❌ Your camera is being used by another application.";

                }

                else if (error.name === "SecurityError") {

                    status.textContent =
                        "❌ Camera access was blocked for security reasons.";

                }

                else {

                    status.textContent =
                        "❌ Could not start the camera: " + error.message;
                }

                status.classList.add("error");
            }
        }


        // STOP CAMERA
        function stopCamera() {

            if (cameraStream) {

                cameraStream.getTracks().forEach(track => {
                    track.stop();
                });

                cameraStream = null;
            }

            video.srcObject = null;

            cameraMessage.classList.remove("hidden");

            cameraMessage.innerHTML =
                "Camera stopped. Click <b>&nbsp;Start Camera&nbsp;</b> to start it again.";

            startBtn.disabled = false;
            stopBtn.disabled = true;

            status.textContent = "Camera is currently off.";
            status.className = "status";
        }


        startBtn.addEventListener("click", startCamera);

        stopBtn.addEventListener("click", stopCamera);


        // Stop the camera when leaving the page
        window.addEventListener("beforeunload", () => {

            if (cameraStream) {

                cameraStream.getTracks().forEach(track => {
                    track.stop();
                });
            }
        });
    </script>

</body>
</html>
