```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Practice</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aab3cc;
            margin-bottom: 25px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            margin: auto;
            background: #05070d;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #27304a;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        .camera-message {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: rgba(5, 7, 13, 0.85);
            color: #dbe2f5;
            font-size: 18px;
            text-align: center;
            z-index: 5;
        }

        .hidden {
            display: none !important;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #5865f2;
            color: white;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #stopCamera {
            background: #ed4245;
        }

        #stopCamera:hover {
            background: #c73537;
        }

        .status {
            margin-top: 18px;
            min-height: 24px;
            color: #aab3cc;
            line-height: 1.5;
        }

        .success {
            color: #57f287;
        }

        .error {
            color: #ed4245;
        }

        .recognition {
            margin-top: 20px;
            padding: 20px;
            background: #11182d;
            border: 1px solid #27304a;
            border-radius: 14px;
        }

        .recognition h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        #signName {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #confidence {
            color: #aab3cc;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>📷 Camera Practice</h1>

        <p class="subtitle">
            Allow camera access to start hand recognition.
        </p>

        <div class="camera-box">

            <video
                id="camera"
                autoplay
                playsinline
                muted>
            </video>

            <canvas id="handCanvas"></canvas>

            <div id="cameraPlaceholder" class="camera-message">
                Click <b>&nbsp;Start Camera&nbsp;</b> to request camera permission.
            </div>

        </div>

        <div class="controls">

            <button id="startCamera">
                📷 Start Camera
            </button>

            <button id="stopCamera" disabled>
                ⛔ Stop Camera
            </button>

        </div>

        <p id="status" class="status">
            Camera is currently off.
        </p>

        <section class="recognition">

            <h2>🧠 Recognition</h2>

            <div id="signName">
                Waiting...
            </div>

            <div id="confidence">
                Press Start Camera to begin.
            </div>

        </section>

    </main>


    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <!-- MediaPipe Drawing -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


    <script src="practice.js"></script>

</body>

</html>
```
